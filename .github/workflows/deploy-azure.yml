name: Deploy to Azure

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/deploy-azure.yml"]
  workflow_dispatch:

permissions:
  id-token: write # sign in to Azure with OIDC, no stored passwords
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    # Doesn't run until you set the repository variables (see infra/azure/README.md).
    if: ${{ vars.AZURE_RG != '' }}
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RG }}
      ACR: ${{ vars.ACR_NAME }}
      API_APP: ${{ vars.API_APP }}
      WEB_APP: ${{ vars.WEB_APP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built on the runner (not with ACR Tasks, which some subscriptions don't allow).
      - name: Log in to the registry
        run: az acr login -n "$ACR"

      - name: Backend
        run: |
          docker build -t "$ACR.azurecr.io/orchid-api:$TAG" ./backend
          docker push "$ACR.azurecr.io/orchid-api:$TAG"
          az containerapp update -g "$RG" -n "$API_APP" --image "$ACR.azurecr.io/orchid-api:$TAG"

      - name: Frontend
        run: |
          API_URL="https://$(az containerapp show -g "$RG" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          docker build -t "$ACR.azurecr.io/orchid-web:$TAG" --build-arg "NEXT_PUBLIC_API_URL=$API_URL" ./frontend
          docker push "$ACR.azurecr.io/orchid-web:$TAG"
          az containerapp update -g "$RG" -n "$WEB_APP" --image "$ACR.azurecr.io/orchid-web:$TAG"
